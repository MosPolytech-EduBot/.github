name: Проблема
description: Что-то сломалось или работает не так, как договаривались
title: "[Проблема] Коротко, что не так"
labels: ["проблема"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
      description: Что делали, что ожидали, что получили
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Доказательства
      description: Фото, скриншот, лог, видео — перетащите файл прямо сюда
  - type: input
    id: where
    attributes:
      label: Где
      placeholder: "Например: прошивка v0.2, стенд с мотором №1, вкладка «Телеметрия»"
